# Scan-only bring-up configuration for the GateMate FPGA TAP.
# Requires a native DirtyJTAG OpenOCD build. The commonly used driver fork
# hard-codes VID:PID 1209:c0ca; change its driver to use 2e8a:000a for the
# custom RP2040 firmware.
adapter driver dirtyjtag
adapter speed 1000

transport select jtag

# The physical FPGA configuration TAP is visible. The RISC-V DMI TAP is not
# currently wired into the design, so this file intentionally does not create
# a RISC-V target or issue a halt.
jtag newtap gatemate fpga -irlen 6 -expected-id 0x20000001
reset_config trst_and_srst srst_open_drain

init
scan_chain